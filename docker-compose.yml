name: MeterFlow Local Datastores & Gateway Stack
services:
  postgres:
    image: postgres:16-alpine
    container_name: meterflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meterflow
      POSTGRES_PASSWORD: meterflow_password
      POSTGRES_DB: meterflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterflow -d meterflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0-jammy
    container_name: meterflow-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: meterflow_logs
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: meterflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    driver: local
  mongodata:
    driver: local
  redisdata:
    driver: local
